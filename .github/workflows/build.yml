name: Build

# Nothing builds on a normal push. A workflow dispatch (Actions tab / gh CLI)
# builds the Linux packages and uploads them as artifacts — no release.
# Pushing a version tag (e.g. v0.3.0), the deliberate "create a release"
# step, builds them and publishes a GitHub release marked latest.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Cancel superseded runs for the same ref to save runner time.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # `**` glob file-args to `--test` need a newer Node than the pinned
        # runner version supports, so enumerate files with `find` instead of
        # relying on the shell/runtime to expand the pattern. `resources/` holds
        # the shared permission-rules engine's tests, so include it too.
        run: npx --no-install tsx --test $(find src resources -name '*.test.ts')

  build:
    name: Build (Linux)
    needs: verify
    # Pinned, not ubuntu-latest: node-pty's native module is compiled on
    # the runner, and glibc 2.42+ (Ubuntu 26.04) gives it versioned
    # cfsetispeed/cfsetospeed symbols, so the AppImage would not start on
    # distros with an older glibc. Raise this only with that in mind.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: 'npm'

      # Runs postinstall, which rebuilds native modules (node-pty) for Electron.
      - name: Install dependencies
        run: npm ci

      # fpm, which electron-builder uses for the pacman target, needs bsdtar.
      - name: Install pacman packaging tools
        run: sudo apt-get install -y --no-install-recommends libarchive-tools

      - name: Type-check
        run: npm run typecheck

      - name: Build renderer/main/preload
        run: npm run build

      - name: Package with electron-builder
        run: npx --no-install electron-builder --linux AppImage deb pacman --publish never

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.pacman
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Attaches the built installers to the release for this tag. If you
      # pre-created the release in the GitHub UI with your own notes, those
      # notes are preserved (no generate_release_notes, no body input). If the
      # tag was pushed without a release, one is created with an empty body.
      - name: Attach installers to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/**/*
